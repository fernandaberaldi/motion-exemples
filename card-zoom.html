<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: palco neutro centralizado; card fixo, imagem com zoom suave no hover */
:root { --bg: #eef1ec; --muted: #6c7568; --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141713; --muted: #8e978a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #141713; --muted: #8e978a; color-scheme: dark; }
html, body { height: 100%; }
body {
  background: var(--bg); font-family: var(--ui);
  display: grid; place-items: center; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}
.stage { width: min(660px, 100%); display: grid; gap: 20px; justify-items: center; }
.card {
  width: 100%; max-width: 100%; aspect-ratio: 1320 / 966;
  container-type: inline-size; border-radius: 2.5cqi; overflow: hidden;
  isolation: isolate; cursor: pointer; outline: none;
}
.card:focus-visible { box-shadow: 0 0 0 3px #c7e89a; }
.card img {
  display: block; width: 100%; height: 100%;
  transform: scale(1); transition: transform .9s cubic-bezier(.2,.7,.2,1);
  user-select: none; -webkit-user-drag: none;
}
.card:hover img, .card:focus-visible img { transform: scale(1.06); }
.hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { .card img { transition: none; } .card:hover img, .card:focus-visible img { transform: none; } }
</style>
