<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaaS Card Tilt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --max-tilt: 3;        /* graus — sutil */
    --glare: .07;         /* intensidade do brilho que segue o mouse (0 = desliga) */
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0c1412;
    font-family: "Inter", system-ui, sans-serif;
    padding: 16px;
  }

  .stage { perspective: 1000px; }

  .card {
    --rx: 0deg; --ry: 0deg; --gx: 50%; --gy: 50%; --go: 0;
    position: relative;
    width: 338px;
    height: 473px;
    border-radius: 16px;
    overflow: hidden;
    background: #e1f9c4;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transform-style: preserve-3d;
    will-change: transform;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .card::before { /* fill 20% #393939 do Container */
    content: ""; position: absolute; inset: 0;
    background: rgba(57,57,57,.2);
  }

  /* brilho sutil que acompanha o cursor */
  .glare {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(60% 50% at var(--gx) var(--gy), rgba(255,255,255,var(--glare)), transparent 70%);
    opacity: var(--go);
    transition: opacity 400ms ease-out;
  }

  /* Frame 144 — painel de vidro */
  .panel {
    position: absolute;
    left: 8px; top: 203px;
    width: 322px; height: 262px;
    padding: 24px;
    border-radius: 8px;
    background: rgba(0,35,29,.6);
    border: 1px solid rgba(250,250,250,.15);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    z-index: 1;
  }
  .panel::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: rgba(250,250,250,.05); pointer-events: none;
  }

  .tag {
    display: inline-flex; align-items: center;
    height: 38px; padding: 0 16px;
    border-radius: 8px;
    background: rgba(240,241,239,.05);
    border: 1px solid rgba(240,241,239,.15);
    color: #fafafa; font-size: 14px; line-height: 20px;
  }
  .title {
    margin-top: 8px;
    color: #fafafa; font-size: 20px; line-height: 28px;
  }
  .desc {
    margin-top: 8px;
    color: #d6d7d5; font-size: 14px; line-height: 20px;
  }
  .link {
    margin-top: 4px;
    display: inline-flex; align-items: center; height: 40px;
    color: #a9d98a; font-size: 16px; line-height: 24px;
    text-decoration: none;
  }
  .link .arrow { width: 33px; display: grid; place-items: center; }

  @media (prefers-reduced-motion: reduce) {
    .card { transform: none !important; }
  }
</style>

      </div>
      <div class="glare" aria-hidden="true"></div>
    </div>
  </div>

<script>
  const card = document.getElementById('card');
  const MAX = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--max-tilt')) || 3;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let target = { rx: 0, ry: 0, gx: 50, gy: 50 };
  let cur = { ...target };
  let raf = null;

  function loop() {
    const k = 0.12; // suavização (lerp)
    let moving = false;
    for (const key in target) {
      cur[key] += (target[key] - cur[key]) * k;
      if (Math.abs(target[key] - cur[key]) > 0.01) moving = true;
    }
    card.style.setProperty('--rx', cur.rx.toFixed(3) + 'deg');
    card.style.setProperty('--ry', cur.ry.toFixed(3) + 'deg');
    card.style.setProperty('--gx', cur.gx.toFixed(1) + '%');
    card.style.setProperty('--gy', cur.gy.toFixed(1) + '%');
    raf = moving ? requestAnimationFrame(loop) : null;
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };

  if (!reduce) {
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;   // 0..1
      const py = (e.clientY - r.top) / r.height;   // 0..1
      target.ry = (px - 0.5) * 2 * MAX;
      target.rx = -(py - 0.5) * 2 * MAX;
      target.gx = px * 100;
      target.gy = py * 100;
      kick();
    });
    card.addEventListener('pointerenter', () => card.style.setProperty('--go', 1));
    card.addEventListener('pointerleave', () => {
      target.rx = 0; target.ry = 0;
      card.style.setProperty('--go', 0);
      kick();
    });
  }
</script>
</body>
</html>
