<title>Hero Motion</title>
<style>
:root{--bg:#f4f5f2;--ink:#00231d;--muted:#5b6b66}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1513;--ink:#e6efec;--muted:#93a39e}}
:root[data-theme="dark"]{--bg:#0f1513;--ink:#e6efec;--muted:#93a39e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif;display:grid;place-items:center;padding:16px}
.stage{position:relative;width:min(480px,88vw);aspect-ratio:1118/1135}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block}
.shape{transform-origin:50% 55%;animation:shapeIn 900ms cubic-bezier(.22,1,.36,1) both, shapeIdle 8s ease-in-out 1.2s infinite}
.photo{transform-origin:50% 55%;animation:photoIn 1000ms cubic-bezier(.22,1,.36,1) 180ms both, photoIdle 6s ease-in-out 1.4s infinite}
@keyframes shapeIn{from{opacity:0;transform:scale(.6) rotate(-14deg)}to{opacity:1;transform:none}}
@keyframes photoIn{from{opacity:0;transform:translateY(28px) scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes shapeIdle{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) scale(1.015)}}
@keyframes photoIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bar{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:28px;color:var(--muted)}
button{font:inherit;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.shape,.photo{animation:none}}
