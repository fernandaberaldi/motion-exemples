.lift{position:absolute;left:9px;right:9px;bottom:9px}
.panel{border-radius:10px;padding:28px 23px 26px;background:rgba(14,48,42,.62);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.panel h3{margin:0 0 14px;font-family:"Instrument Sans",Inter,sans-serif;font-weight:600;font-size:20px;line-height:1.2;letter-spacing:-.01em;color:#fff}
.ln{display:block;overflow:hidden}
.ln>span{display:block;font-size:14px;line-height:23.5px;color:rgba(255,255,255,.8);white-space:nowrap}
.ctrl{display:flex;gap:12px;align-items:center;font-size:13px;flex-wrap:wrap;justify-content:center}
button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:8px;padding:6px 12px;cursor:pointer;opacity:.85}
button:hover{opacity:1}
</style>
</head>
<body>
<div class="card">
  <div class="zoom"><div class="photo" id="photo"></div></div>
  <div class="lift">
    <div class="panel" id="panel">
      <h3 id="title">Sua operação entra no ar</h3>
      <span class="ln"><span>A Farmtech organiza o funding e constitui uma</span></span>
      <span class="ln"><span>estrutura exclusiva com o nome da sua empresa.</span></span>
      <span class="ln"><span>Analisamos a sua base de clientes e, em cerca</span></span>
      <span class="ln"><span>de cinco semanas, a operação está pronta para</span></span>
      <span class="ln"><span>rodar.</span></span>
    </div>
  </div>
</div>
<div class="ctrl">
  <button id="replay">Repetir</button>
  <label><input type="checkbox" id="slow"> Câmera lenta (4x)</label>
  <span>· passe o mouse no card</span>
</div>
<script>
const E='cubic-bezier(0.22,1,0.36,1)';
const photo=document.getElementById('photo'),panel=document.getElementById('panel'),title=document.getElementById('title');
let anims=[];
function play(){
  anims.forEach(a=>a.cancel());anims=[];
  const k=document.getElementById('slow').checked?4:1;
  const o=(el,kf,d,dl)=>anims.push(el.animate(kf,{duration:d*k,delay:dl*k,easing:E,fill:'backwards'}));
  o(photo,[{transform:'scale(1.08)'},{transform:'scale(1)'}],1200,0);
  o(panel,[{transform:'translateY(32px)',opacity:0,backdropFilter:'blur(0px)'},{transform:'translateY(0)',opacity:1,backdropFilter:'blur(16px)'}],700,200);
  o(title,[{transform:'translateY(12px)',opacity:0},{transform:'translateY(0)',opacity:1}],500,350);
  document.querySelectorAll('.ln>span').forEach((s,i)=>o(s,[{transform:'translateY(100%)'},{transform:'translateY(0)'}],500,450+i*60));
}
document.getElementById('replay').onclick=play;
document.getElementById('slow').onchange=play;
play();
</script>
</body>
</html>
